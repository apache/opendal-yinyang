[package]
categories = ["filesystem"]
description = "Apache OpenDAL™ YinYang"
keywords = ["storage", "filesystem"]
name = "yinyang"
version = "0.0.24"

authors = ["Apache OpenDAL <dev@opendal.apache.org>"]
edition.workspace = true
homepage.workspace = true
license.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "yy"
path = "src/main.rs"

[dependencies]
blake3.workspace = true
borsh.workspace = true
clap.workspace = true
opendal = { workspace = true, features = ["http-transport-reqwest", "services-s3"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { workspace = true, features = ["fs", "macros", "rt-multi-thread", "sync"] }
uuid.workspace = true
yinyang-core = { path = "crates/core" }

[workspace]
members = [".", "crates/core", "crates/native", "xtask"]
resolver = "3"

[workspace.package]
edition = "2024"
homepage = "https://opendal.apache.org/"
license = "Apache-2.0"
repository = "https://github.com/apache/opendal-yinyang"
rust-version = "1.91.0"

[workspace.dependencies]
blake3 = "1"
borsh = { version = "1.8.1", default-features = false, features = ["derive", "std"] }
clap = { version = "4.6.5", features = ["derive"] }
futures-util = "0.3"
opendal = { version = "0.58.2", default-features = false }
tokio = { version = "1", features = ["io-util"] }
unicode-casefold = "=0.2.0"
unicode-normalization = "=0.1.25"
uuid = { version = "1", features = ["v4"] }
which = { version = "8.0.5" }

[workspace.metadata.release]
pre-release-commit-message = "chore: release v{{version}}"
shared-version = true
sign-tag = true
tag-name = "v{{version}}"

[workspace.lints.rust]
unknown_lints = "deny"
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
too_many_arguments = "allow"
type_complexity = "allow"

[lints]
workspace = true
