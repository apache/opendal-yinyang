name: Apache OpenDAL™ YinYang CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Show Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Check lockfile
        run: cargo update -w --locked --verbose

      - name: Install repository tools
        uses: taiki-e/install-action@v2
        with:
          tool: taplo-cli,typos-cli

      - name: Run linters
        run: cargo x lint

      - name: Check targets
        run: cargo x check

  msrv:
    name: MSRV
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      YINYANG_MSRV: "1.91.0"
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust MSRV
        run: rustup toolchain install "$YINYANG_MSRV"

      - name: Check with Rust MSRV
        run: cargo +"$YINYANG_MSRV" check --workspace --all-targets --locked

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Show Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Run tests
        run: cargo x test

  compliance:
    name: Compliance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install repository tools
        uses: taiki-e/install-action@v2
        with:
          tool: hawkeye,cargo-deny@0.14.22

      - name: Check licenses
        run: cargo x licenses

  s3:
    name: S3 transfer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      YINYANG_S3_BUCKET: yinyang-test
      YINYANG_S3_ENDPOINT: http://127.0.0.1:9000
      YINYANG_S3_REGION: us-east-1
      YINYANG_S3_ACCESS_KEY_ID: yinyang-test
      YINYANG_S3_SECRET_ACCESS_KEY: yinyang-test-only
      YINYANG_STORAGE_PROFILE: minio
    steps:
      - uses: actions/checkout@v7

      - name: Start isolated S3-compatible storage
        run: |
          docker run -d --name yinyang-silo -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=yinyang-test -e MINIO_ROOT_PASSWORD=yinyang-test-only \
            docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46 server /data
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:9000/minio/health/ready
          docker exec yinyang-silo mcli alias set local http://127.0.0.1:9000 yinyang-test yinyang-test-only
          docker exec yinyang-silo mcli mb local/yinyang-test

      - name: Exercise core publication and CLI round trips
        run: |
          cargo test --workspace --all-targets s3_ -- \
            --ignored --nocapture \
            --skip isolated_s3_cli_smoke \
            --skip real_amazon_s3_cli_smoke

      - name: Show storage logs on failure
        if: failure()
        run: |
          if docker container inspect yinyang-silo > /dev/null 2>&1; then
            docker logs yinyang-silo
          fi

  managed_sync:
    name: Managed Sync acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      YINYANG_S3_BUCKET: yinyang-test
      YINYANG_S3_ENDPOINT: http://127.0.0.1:9000
      YINYANG_S3_REGION: us-east-1
      YINYANG_S3_ACCESS_KEY_ID: yinyang-test
      YINYANG_S3_SECRET_ACCESS_KEY: yinyang-test-only
      YINYANG_STORAGE_PROFILE: minio
    steps:
      - uses: actions/checkout@v7

      - name: Start isolated S3-compatible storage
        run: |
          docker run -d --name yinyang-managed-sync-silo -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=yinyang-test -e MINIO_ROOT_PASSWORD=yinyang-test-only \
            docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46 server /data
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:9000/minio/health/ready
          docker exec yinyang-managed-sync-silo mcli alias set local http://127.0.0.1:9000 yinyang-test yinyang-test-only
          docker exec yinyang-managed-sync-silo mcli mb local/yinyang-test

      - name: Run real Managed Sync acceptance
        run: cargo x test-managed-sync

      - name: Show storage logs on failure
        if: failure()
        run: |
          if docker container inspect yinyang-managed-sync-silo > /dev/null 2>&1; then
            docker logs yinyang-managed-sync-silo
          fi

  linux-fuse:
    name: Linux FUSE acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      YINYANG_S3_BUCKET: yinyang-test
      YINYANG_S3_ENDPOINT: http://127.0.0.1:9000
      YINYANG_S3_REGION: us-east-1
      YINYANG_S3_ACCESS_KEY_ID: yinyang-test
      YINYANG_S3_SECRET_ACCESS_KEY: yinyang-test-only
      YINYANG_STORAGE_PROFILE: minio
    steps:
      - uses: actions/checkout@v7

      - name: Show FUSE device
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3
          ls -l /dev/fuse

      - name: Start isolated S3-compatible storage
        run: |
          docker run -d --name yinyang-linux-fuse-silo -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=yinyang-test -e MINIO_ROOT_PASSWORD=yinyang-test-only \
            docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46 server /data
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:9000/minio/health/ready
          docker exec yinyang-linux-fuse-silo mcli alias set local http://127.0.0.1:9000 yinyang-test yinyang-test-only
          docker exec yinyang-linux-fuse-silo mcli mb local/yinyang-test

      - name: Run real Linux FUSE acceptance
        run: cargo x test-linux-fuse

      - name: Show storage logs on failure
        if: failure()
        run: |
          if docker container inspect yinyang-linux-fuse-silo > /dev/null 2>&1; then
            docker logs yinyang-linux-fuse-silo
          fi

  required:
    name: Required
    runs-on: ubuntu-24.04
    if: ${{ always() }}
    needs:
      - check
      - msrv
      - test
      - compliance
      - s3
      - managed_sync
      - linux-fuse
    steps:
      - name: Guardian
        run: |
          if [[ ! ( \
                 "${{ needs.check.result }}" == "success" \
              && "${{ needs.msrv.result }}" == "success" \
              && "${{ needs.test.result }}" == "success" \
              && "${{ needs.compliance.result }}" == "success" \
              && "${{ needs.s3.result }}" == "success" \
              && "${{ needs.managed_sync.result }}" == "success" \
              && "${{ needs.linux-fuse.result }}" == "success" \
              ) ]]; then
            echo "Required jobs haven't been completed successfully."
            exit 1
          fi
