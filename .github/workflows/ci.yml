name: Apache OpenDAL™ YinYang CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Show Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Check lockfile
        run: cargo update -w --locked --verbose

      - name: Install repository tools
        uses: taiki-e/install-action@v2
        with:
          tool: taplo-cli,typos-cli

      - name: Run linters
        run: cargo x lint

      - name: Check targets
        run: cargo x check

  msrv:
    name: MSRV
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      YINYANG_MSRV: "1.91.0"
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust MSRV
        run: rustup toolchain install "$YINYANG_MSRV"

      - name: Check with Rust MSRV
        run: cargo +"$YINYANG_MSRV" check --workspace --all-targets --locked

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Show Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Run tests
        run: cargo x test

  compliance:
    name: Compliance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install repository tools
        uses: taiki-e/install-action@v2
        with:
          tool: hawkeye,cargo-deny@0.14.22

      - name: Check licenses
        run: cargo x licenses

  s3:
    name: S3 transfer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      YINYANG_S3_BUCKET: yinyang-test
      YINYANG_S3_ENDPOINT: http://127.0.0.1:9000
      YINYANG_S3_REGION: us-east-1
      YINYANG_S3_ACCESS_KEY_ID: yinyang-test
      YINYANG_S3_SECRET_ACCESS_KEY: yinyang-test-only
      YINYANG_STORAGE_PROFILE: minio
    steps:
      - uses: actions/checkout@v7

      - name: Start isolated S3-compatible storage
        run: |
          docker run -d --name yinyang-minio -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=yinyang-test -e MINIO_ROOT_PASSWORD=yinyang-test-only \
            quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e server /data
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:9000/minio/health/live
          docker exec yinyang-minio mc alias set local http://127.0.0.1:9000 yinyang-test yinyang-test-only
          docker exec yinyang-minio mc mb local/yinyang-test

      - name: Exercise core publication and CLI round trips
        run: cargo test --workspace --all-targets s3_ -- --ignored --nocapture

  required:
    name: Required
    runs-on: ubuntu-24.04
    if: ${{ always() }}
    needs:
      - check
      - msrv
      - test
      - compliance
      - s3
    steps:
      - name: Guardian
        run: |
          if [[ ! ( \
                 "${{ needs.check.result }}" == "success" \
              && "${{ needs.msrv.result }}" == "success" \
              && "${{ needs.test.result }}" == "success" \
              && "${{ needs.compliance.result }}" == "success" \
              && "${{ needs.s3.result }}" == "success" \
              ) ]]; then
            echo "Required jobs haven't been completed successfully."
            exit 1
          fi
