name: Apache OpenDAL™ YinYang CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Show Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Check lockfile
        run: cargo update -w --locked --verbose

      - name: Install repository tools
        uses: taiki-e/install-action@v2
        with:
          tool: taplo-cli,typos-cli

      - name: Run linters
        run: cargo x lint

      - name: Check targets
        run: cargo x check

  msrv:
    name: MSRV
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      YINYANG_MSRV: "1.91.0"
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust MSRV
        run: rustup toolchain install "$YINYANG_MSRV"

      - name: Check with Rust MSRV
        run: cargo +"$YINYANG_MSRV" check --workspace --all-targets --locked

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Show Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Run tests
        run: cargo x test

  compliance:
    name: Compliance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install repository tools
        uses: taiki-e/install-action@v2
        with:
          tool: hawkeye,cargo-deny@0.14.22

      - name: Check licenses
        run: cargo x licenses

  s3:
    name: S3 transfer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      YINYANG_S3_BUCKET: yinyang-test
      YINYANG_S3_ENDPOINT: http://127.0.0.1:9000
      YINYANG_S3_REGION: us-east-1
      YINYANG_S3_ACCESS_KEY_ID: yinyang-test
      YINYANG_S3_SECRET_ACCESS_KEY: yinyang-test-only
      YINYANG_STORAGE_PROFILE: minio
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.24.7"
          cache: false

      - name: Build pinned S3 test tools
        env:
          GOBIN: ${{ runner.temp }}/yinyang-s3-bin
        run: |
          # Build official source releases; the former prebuilt images are unavailable.
          # MinIO RELEASE.2025-09-07T16-13-09Z; mc RELEASE.2025-08-13T08-35-41Z.
          go install github.com/minio/minio@07c3a429bfed433e49018cb0f78a52145d4bedeb
          go install github.com/minio/mc@7394ce0dd2a80935aded936b09fa12cbb3cb8096
          echo "$GOBIN" >> "$GITHUB_PATH"

      - name: Start isolated S3-compatible storage
        run: |
          MINIO_ROOT_USER=yinyang-test MINIO_ROOT_PASSWORD=yinyang-test-only \
            minio server "$RUNNER_TEMP/yinyang-s3-data" --address 127.0.0.1:9000 \
            --console-address 127.0.0.1:9001 > "$RUNNER_TEMP/yinyang-minio.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:9000/minio/health/ready
          mc --config-dir "$RUNNER_TEMP/yinyang-mc" alias set local http://127.0.0.1:9000 yinyang-test yinyang-test-only
          mc --config-dir "$RUNNER_TEMP/yinyang-mc" mb local/yinyang-test

      - name: Exercise core publication and CLI round trips
        run: cargo test --workspace --all-targets s3_ -- --ignored --nocapture

      - name: Show storage logs on failure
        if: failure()
        run: |
          if [[ -f "$RUNNER_TEMP/yinyang-minio.log" ]]; then
            cat "$RUNNER_TEMP/yinyang-minio.log"
          fi

  required:
    name: Required
    runs-on: ubuntu-24.04
    if: ${{ always() }}
    needs:
      - check
      - msrv
      - test
      - compliance
      - s3
    steps:
      - name: Guardian
        run: |
          if [[ ! ( \
                 "${{ needs.check.result }}" == "success" \
              && "${{ needs.msrv.result }}" == "success" \
              && "${{ needs.test.result }}" == "success" \
              && "${{ needs.compliance.result }}" == "success" \
              && "${{ needs.s3.result }}" == "success" \
              ) ]]; then
            echo "Required jobs haven't been completed successfully."
            exit 1
          fi
