name: YinYang
options:
  deploymentTarget:
    macOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_EMIT_LOC_STRINGS: NO
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
targets:
  YinYang:
    type: application
    platform: macOS
    sources: [Host]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xuanwo.yinyang.prototype
        CODE_SIGN_ENTITLEMENTS: "$(YINYANG_SOURCE_ROOT)/platforms/macos/Host/Host.entitlements"
        INFOPLIST_KEY_CFBundleDisplayName: YinYang Prototype
        PROVISIONING_PROFILE_SPECIFIER: ""
    dependencies:
      - target: YinYangFSKit
        embed: true
  YinYangFSKit:
    type: extensionkit-extension
    platform: macOS
    sources: [Shared, FSKit]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xuanwo.yinyang.prototype.fskit
        INFOPLIST_FILE: "$(YINYANG_SOURCE_ROOT)/platforms/macos/FSKit/Info.plist"
        CODE_SIGN_ENTITLEMENTS: "$(YINYANG_SOURCE_ROOT)/platforms/macos/FSKit/FSKit.entitlements"
        PROVISIONING_PROFILE_SPECIFIER: "$(YINYANG_FSKIT_PROFILE)"
        SWIFT_OBJC_BRIDGING_HEADER: "$(YINYANG_BRIDGING_HEADER)"
        OTHER_LDFLAGS: ["$(inherited)", "$(YINYANG_NATIVE_LIBRARY)", "-framework", Security, "-framework", SystemConfiguration, "-lc++"]
schemes:
  YinYang:
    build:
      targets:
        YinYang: all
