include: project.yml
targets:
  YinYang:
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: "$(YINYANG_SOURCE_ROOT)/platforms/macos/Host/Provider.entitlements"
        PROVISIONING_PROFILE_SPECIFIER: "$(YINYANG_HOST_PROFILE)"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) YINYANG_FILE_PROVIDER"
    dependencies:
      - target: YinYangFileProvider
        embed: true
  YinYangFileProvider:
    type: app-extension
    platform: macOS
    sources:
      - Shared
      - path: FileProvider
        excludes: [Info.plist, FileProvider.entitlements]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xuanwo.yinyang.prototype.fileprovider
        INFOPLIST_FILE: "$(YINYANG_SOURCE_ROOT)/platforms/macos/FileProvider/Info.plist"
        CODE_SIGN_ENTITLEMENTS: "$(YINYANG_SOURCE_ROOT)/platforms/macos/FileProvider/FileProvider.entitlements"
        PROVISIONING_PROFILE_SPECIFIER: "$(YINYANG_PROVIDER_PROFILE)"
        SWIFT_OBJC_BRIDGING_HEADER: "$(YINYANG_BRIDGING_HEADER)"
        OTHER_LDFLAGS: ["$(inherited)", "$(YINYANG_NATIVE_LIBRARY)", "-framework", Security, "-framework", SystemConfiguration, "-lc++"]
